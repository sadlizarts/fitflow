  <!-- #4 Actual vs planned energy balance -->
  <sc-if value="{{ defShow }}" hint-placeholder-val="{{ false }}">
  <div style="margin-top:12px; margin-bottom:8px; position:relative; overflow:hidden; background:var(--surface-warm-card); border:1px solid {{ defBorder }}; border-radius:var(--radius-lg); padding:16px;">
    <span aria-hidden="true" style="position:absolute; top:-70px; right:-50px; width:200px; height:170px; pointer-events:none; background:radial-gradient(50% 50% at 70% 20%, {{ defGlow }}, transparent 70%);"></span>
    <div style="position:relative;">
      <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px;">laju progres · rencana vs aktual</div>
      <sc-if value="{{ defReady }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; align-items:flex-end; gap:16px; margin-top:10px;">
          <div style="flex:1;">
            <div style="font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint);">rencana</div>
            <div style="font-family:var(--font-serif); font-size:26px; line-height:1;">{{ defPlanned }}<span style="font-size:12px; color:var(--text-muted);"> kg/mgg</span></div>
          </div>
          <div style="width:1px; align-self:stretch; background:var(--border-subtle);"></div>
          <div style="flex:1;">
            <div style="font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint);">aktual (tren berat)</div>
            <div style="font-family:var(--font-serif); font-size:26px; line-height:1; color:{{ defColor }};">{{ defActual }}<span style="font-size:12px; color:var(--text-muted);"> kg/mgg</span></div>
          </div>
        </div>
      </sc-if>
      <div style="font-size:12.5px; color:var(--text-secondary); margin-top:12px; line-height:1.55;">{{ defNote }}</div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-top:8px;">{{ defMeta }}</div>
    </div>
  </div>
  </sc-if>

  <!-- Custom food form -->
  <sc-if value="{{ nutFormOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:rgba(8,9,11,0.8); z-index:60; display:flex; align-items:flex-end; justify-content:center;" sc-camel-on-click="{{ nutFormClose }}">
      <div style="width:100%; max-width:430px; background:var(--surface-warm-raised); border:1px solid var(--border-default); border-radius:16px 16px 0 0; padding:12px 18px 28px; animation:ffsheet 260ms var(--ease-out, ease-out);" sc-camel-on-click="{{ nutFormStop }}">
        <div style="width:36px; height:4px; border-radius:99px; background:var(--border-default); margin:0 auto 14px;"></div>
        <div style="font-family:var(--font-serif); font-size:22px;">Makanan baru</div>
        <div style="font-size:12.5px; color:var(--text-muted); margin-top:2px;">Isi makro — kalori dihitung otomatis. Tersimpan ke library untuk quick-add berikutnya.</div>
        <input value="{{ nutFName }}" sc-camel-on-input="{{ nutFSetName }}" placeholder="Nama makanan" style="width:100%; height:46px; margin-top:14px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 14px; font-size:15px;">
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;">
          <div><div style="font-size:10px; color:var(--text-faint); margin-bottom:4px; font-family:var(--font-mono); letter-spacing:0.1em;">PROTEIN g</div><input value="{{ nutFP }}" sc-camel-on-input="{{ nutFSetP }}" sc-camel-input-mode="decimal" style="width:100%; height:46px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:15px;"></div>
          <div><div style="font-size:10px; color:var(--text-faint); margin-bottom:4px; font-family:var(--font-mono); letter-spacing:0.1em;">KARBO g</div><input value="{{ nutFC }}" sc-camel-on-input="{{ nutFSetC }}" sc-camel-input-mode="decimal" style="width:100%; height:46px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:15px;"></div>
          <div><div style="font-size:10px; color:var(--text-faint); margin-bottom:4px; font-family:var(--font-mono); letter-spacing:0.1em;">LEMAK g</div><input value="{{ nutFF }}" sc-camel-on-input="{{ nutFSetF }}" sc-camel-input-mode="decimal" style="width:100%; height:46px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:15px;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:13px; color:var(--text-secondary);">
          <span>Estimasi kalori</span><span style="font-family:var(--font-mono); color:var(--gold-300);">{{ nutFKcal }} kkal</span>
        </div>
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button sc-camel-on-click="{{ nutFSave }}" style="flex:1; height:48px; border:none; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-weight:700; font-size:15px; cursor:pointer;">Simpan &amp; catat</button>
          <button sc-camel-on-click="{{ nutFormClose }}" style="height:48px; padding:0 18px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); cursor:pointer;">Batal</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</sc-if>

<!-- Bottom nav -->
<div style="position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; z-index:30; background:rgba(16,13,9,0.92); backdrop-filter:blur(14px); border-top:1px solid var(--border-subtle); display:grid; grid-template-columns:repeat(6,1fr); padding:8px 4px calc(10px + env(safe-area-inset-bottom));">
  <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
    <button sc-camel-on-click="{{ n.onTap }}" style="{{ n.style }}">
      <span style="position:relative;">
        <svg sc-camel-view-box="0 0 24 24" style="width:21px; height:21px; display:block;" fill="none" stroke="currentColor" sc-camel-stroke-width="1.7" sc-camel-stroke-linecap="round" sc-camel-stroke-linejoin="round"><path d="{{ n.icon }}"></path></svg>
        <span style="{{ n.dotStyle }}"></span>

</sc-if>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;: {&quot;width&quot;: 430, &quot;height&quot;: 900}, &quot;showEngineReasons&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Engine&quot;}, &quot;restSound&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sesi&quot;}}"></script>
<div id="ff-update" style="display:none; position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:calc(100% - 24px); max-width:406px; z-index:60; background:#1d1810; border:1px solid rgba(232,161,60,0.5); border-radius:999px; padding:10px 10px 10px 18px; box-shadow:0 12px 40px rgba(0,0,0,0.5); align-items:center; gap:12px; font-family:Manrope, system-ui, sans-serif;">
  <span style="flex:1; font-size:13.5px; color:#f6f3ed;">Versi baru FitFlow tersedia.</span>
  <button id="ff-update-btn" style="height:38px; padding:0 18px; border:none; border-radius:999px; background:#e8a13c; color:#1a1408; font-weight:700; font-size:13px; cursor:pointer;">Muat ulang</button>
</div>
<script>
  var userAskedReload = false;
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        function offer(worker) {
          var bar = document.getElementById('ff-update'); if (!bar) return;
          bar.style.display = 'flex';
          document.getElementById('ff-update-btn').onclick = function () { userAskedReload = true; worker.postMessage({ type: 'SKIP_WAITING' }); };
        }
        if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener('statechange', function () { if (nw.state === 'installed' && navigator.serviceWorker.controller) offer(nw); });
        });
      }).catch(function (e) { console.warn('[FitFlow] service worker gagal:', e); });
      // reload only when the user tapped "Muat ulang" — never on the very first install (clients.claim also fires controllerchange)
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (refreshing || !userAskedReload) return; refreshing = true; location.reload(); });
    });
  }
</script>
