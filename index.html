<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitFlow</title>
<meta name="description" content="FitFlow — personal adaptive training tracker. Offline, satu pengguna.">
<meta name="theme-color" content="#0f0d0a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitFlow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
<script>
  // dc-runtime resolves React through this map instead of the CDN (offline-first).
  window.__resources = { "https://unpkg.com/react@18.3.1/umd/react.production.min.js": './vendor/react.production.min.js', "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": './vendor/react-dom.production.min.js' };
  // PWA install prompt (Chrome Android): keep the event, the app shows a "Pasang" card in More.
  window.__ffInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__ffInstallPrompt = e; window.dispatchEvent(new Event('ff-install-ready')); });
  window.addEventListener('appinstalled', function () { window.__ffInstallPrompt = null; window.dispatchEvent(new Event('ff-install-ready')); });
</script>
<script src="./vendor/lucent-ds.js"></script>
<script src="./engine.js"></script>
<script src="./app.js"></script>
<script src="./vendor/dc-runtime.js"></script>
</head>
<body>
<template id="ff-dc">
<x-dc>
<helmet></helmet>
<div id="ff-splash"><img src="./assets/logo-mark.png" alt="FitFlow" style="width:120px;height:auto;filter:drop-shadow(0 8px 30px rgba(232,161,60,0.3));animation:ffsplashpulse 1.4s ease-in-out infinite;"></div>
<div style="min-height:100dvh; background:var(--void); display:flex; justify-content:center;">
<div style="width:100%; max-width:430px; min-height:100dvh; background:var(--surface-warm-base); color:var(--text-primary); position:relative; padding-bottom:96px; overflow:hidden;">
<div aria-hidden="true" style="position:absolute; top:-180px; left:50%; transform:translateX(-50%); width:520px; height:420px; pointer-events:none; z-index:0; background:radial-gradient(50% 55% at 50% 0%, rgba(232,161,60,0.16), rgba(232,161,60,0.05) 45%, transparent 72%); animation:ffglow 9s ease-in-out infinite;"></div>
<div style="position:relative; z-index:1;">
<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">

<!-- ============ HOME ============ -->
<sc-if value="{{ tabHome }}" hint-placeholder-val="{{ true }}">
<div style="padding:22px 18px 0; animation:fftab 260ms var(--ease-out, ease-out);">
  <div style="display:flex; align-items:flex-end; justify-content:space-between;">
    <img src="./assets/logo-wordmark.png" alt="FitFlow — Adaptive Training Tracker" style="height:52px; width:auto; display:block; margin-left:-4px;">
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px; padding-bottom:8px;">
      <span style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-300); padding:3px 8px; border:1px solid var(--border-warm); border-radius:999px; background:var(--interactive-warm-soft); white-space:nowrap;">v{{ appVersion }} · PWA</span>
      <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-muted);">{{ todayStr }}</div>
    </div>
  </div>

  <!-- Streak strip -->
  <button sc-camel-on-click="{{ goBadges }}" style="margin-top:16px; width:100%; display:flex; align-items:center; gap:14px; position:relative; overflow:hidden; border:1px solid var(--border-warm); border-radius:var(--radius-lg); padding:14px 16px; background:linear-gradient(120deg, #241a0e, #16120c 70%); cursor:pointer; color:var(--text-primary); text-align:left;">
    <span aria-hidden="true" style="position:absolute; top:-40px; right:-30px; width:160px; height:130px; pointer-events:none; background:radial-gradient(50% 50% at 70% 20%, rgba(232,161,60,0.24), transparent 70%);"></span>
    <span style="font-size:32px; flex:none; filter:{{ streakFlameFilter }};">🔥</span>
    <span style="flex:1; position:relative;">
      <span style="display:block; font-family:var(--font-serif); font-size:26px; line-height:1;">{{ streakCurrent }} <span style="font-size:14px; color:var(--text-muted); font-family:var(--font-sans);">hari beruntun</span></span>
      <span style="display:block; font-size:12px; color:var(--text-muted); margin-top:3px;">{{ streakSub }}</span>
    </span>
    <span style="position:relative; text-align:right; flex:none;">
      <span style="display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint);">terbaik</span>
      <span style="display:block; font-family:var(--font-serif); font-size:20px; color:var(--gold-300);">{{ streakLongest }}</span>
    </span>
  </button>

  <sc-if value="{{ hasActive }}" hint-placeholder-val="{{ false }}">
    <button sc-camel-on-click="{{ goWorkout }}" style="margin-top:14px; width:100%; display:flex; align-items:center; gap:12px; background:var(--surface-warm-hi); border:1px solid var(--border-warm); border-radius:var(--radius-md); padding:12px 16px; cursor:pointer; color:var(--text-primary); text-align:left;">
      <span style="width:8px; height:8px; border-radius:99px; background:var(--gold-500); flex:none; animation:ffpulse 2.4s infinite;"></span>
      <span style="flex:1; font-size:14px;"><span style="font-weight:700;">Sesi aktif</span> · {{ abTitle }} · {{ abElapsed }}</span>
      <span style="color:var(--gold-400); font-size:13px; font-weight:600; flex:none;">Lanjutkan ›</span>
    </button>
  </sc-if>

  <sc-if value="{{ hasReminders }}" hint-placeholder-val="{{ false }}">
    <button sc-camel-on-click="{{ toggleReminders }}" style="margin-top:14px; width:100%; display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid rgba(232,161,60,0.35); border-radius:var(--radius-md); background:rgba(232,161,60,0.07); font-size:13px; color:var(--gold-300); cursor:pointer; text-align:left;">
      <span style="width:6px; height:6px; border-radius:99px; background:var(--warning); flex:none;"></span>
      <span style="flex:1;">{{ reminderSummary }}</span>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--text-faint); flex:none;">{{ reminderChevron }}</span>
    </button>
    <sc-if value="{{ remindersOpen }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:6px; display:flex; flex-direction:column; gap:6px;">
        <sc-for list="{{ reminders }}" as="r" hint-placeholder-count="1">
          <div style="padding:8px 14px 8px 30px; font-size:12.5px; color:var(--text-secondary); line-height:1.5;">· {{ r }}</div>
        </sc-for>
      </div>
    </sc-if>
  </sc-if>

  <!-- Context: collapsed summary OR full editor -->
  <sc-if value="{{ ctxCollapsed }}" hint-placeholder-val="{{ false }}">
    <button sc-camel-on-click="{{ openCtx }}" style="margin-top:16px; width:100%; display:flex; align-items:center; gap:10px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:999px; padding:11px 18px; cursor:pointer; color:var(--text-secondary); font-size:13.5px; text-align:left;">
      <span style="flex:1;">{{ ctxSummary }}</span>
      <span style="color:var(--gold-400); font-size:12.5px; font-weight:600; flex:none;">Ubah</span>
    </button>
  </sc-if>
  <sc-if value="{{ ctxOpen }}" hint-placeholder-val="{{ true }}">
  <div style="margin-top:16px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:16px;">
    <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;">kondisi hari ini</div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
      <sc-for list="{{ readinessOpts }}" as="o" hint-placeholder-count="3">
        <button sc-camel-on-click="{{ o.onTap }}" style="{{ o.style }}">{{ o.label }}</button>
      </sc-for>
    </div>
    <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); margin:14px 0 10px;">area nyeri otot <span style="color:var(--text-faint); text-transform:none; letter-spacing:0;">— tap 1× ringan, 2× berat</span></div>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      <sc-for list="{{ soreOpts }}" as="o" hint-placeholder-count="4">
        <button sc-camel-on-click="{{ o.onTap }}" style="{{ o.style }}">{{ o.label }}</button>
      </sc-for>
    </div>
    <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); margin:14px 0 10px;">lokasi</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      <sc-for list="{{ locOpts }}" as="o" hint-placeholder-count="3">
        <button sc-camel-on-click="{{ o.onTap }}" style="{{ o.style }}">{{ o.label }}</button>
      </sc-for>
    </div>
    <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); margin:14px 0 10px;">waktu tersedia</div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">
      <sc-for list="{{ minOpts }}" as="o" hint-placeholder-count="4">
        <button sc-camel-on-click="{{ o.onTap }}" style="{{ o.style }}">{{ o.label }}</button>
      </sc-for>
    </div>
    <button sc-camel-on-click="{{ closeCtx }}" style="margin-top:14px; width:100%; height:44px; border:1px solid var(--border-warm); border-radius:999px; background:var(--interactive-warm-soft); color:var(--gold-300); font-size:14px; font-weight:600; cursor:pointer;">Terapkan</button>
  </div>
  </sc-if>

  <!-- Recommendation -->
  <sc-if value="{{ recVisible }}" hint-placeholder-val="{{ true }}">
  <div style="margin-top:16px; position:relative; overflow:hidden; border:1px solid var(--border-warm); border-radius:var(--radius-lg); padding:20px 18px; background:linear-gradient(155deg, #241a0e 0%, #1a150f 46%, #141210 100%);">
    <span aria-hidden="true" style="position:absolute; top:-90px; right:-60px; width:260px; height:220px; pointer-events:none; background:radial-gradient(50% 50% at 70% 20%, rgba(232,161,60,0.28), transparent 70%); animation:ffglow 7s ease-in-out infinite;"></span>
    <span style="position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg, var(--gold-400), var(--gold-500) 60%, transparent);"></span>
    <div style="position:relative;">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="width:6px; height:6px; border-radius:99px; background:var(--gold-400); box-shadow:0 0 8px var(--gold-400);"></span>
      <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.24em; text-transform:uppercase; color:var(--gold-400);">rekomendasi hari ini</div>
    </div>
    <div style="font-family:var(--font-serif); font-size:34px; line-height:1.05; margin-top:10px; background:linear-gradient(120deg, #fff 0%, #f3e6cd 50%, #d9a343 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;">{{ recType }}</div>
    <div style="color:var(--text-secondary); font-size:14px; margin-top:4px;">{{ recFocus }}</div>
    <sc-if value="{{ recHasWhy }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:10px; display:flex; align-items:flex-start; gap:8px; padding:9px 12px; border-radius:var(--radius-sm); background:rgba(8,9,11,0.32); border:1px solid var(--border-subtle);">
        <span style="font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-400); flex:none; margin-top:2px;">why</span>
        <span style="font-size:12.5px; color:var(--text-secondary); line-height:1.45;">{{ recWhy }}</span>
      </div>
    </sc-if>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;">
      <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em; white-space:nowrap; text-transform:uppercase; color:var(--gold-300); padding:5px 11px; border:1px solid var(--border-warm); border-radius:999px; background:rgba(232,161,60,0.06);">± {{ recDur }} mnt</span>
      <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em; white-space:nowrap; text-transform:uppercase; color:var(--text-secondary); padding:5px 11px; border:1px solid var(--border-subtle); border-radius:999px;">{{ recMeta }}</span>
      <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em; white-space:nowrap; text-transform:uppercase; color:var(--text-secondary); padding:5px 11px; border:1px solid var(--border-subtle); border-radius:999px;">{{ recIntensity }}</span>
    </div>
    <sc-if value="{{ recHasItems }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:14px; display:flex; flex-direction:column; gap:6px;">
        <sc-for list="{{ recItems }}" as="it" hint-placeholder-count="3">
          <div style="font-size:13.5px; color:var(--text-secondary); display:flex; gap:8px;"><span style="color:var(--gold-500);">·</span><span>{{ it }}</span></div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ recHasExercises }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:16px; border-top:1px solid var(--border-subtle); padding-top:6px; display:flex; flex-direction:column;">
        <sc-for list="{{ recExList }}" as="e" hint-placeholder-count="5">
          <div style="{{ e.rowStyle }}">
            <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; color:{{ e.numColor }}; flex:none; width:20px; padding-top:3px;">{{ e.num }}</span>
            <span style="flex:1; min-width:0;">
              <span style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:14.5px; font-weight:600; color:var(--text-primary); line-height:1.2;">{{ e.name }}</span>
                <sc-if value="{{ e.primary }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-mono); font-size:8px; letter-spacing:0.12em; text-transform:uppercase; color:var(--interactive-warm-ink); background:var(--gold-400); padding:2px 5px; border-radius:3px; flex:none;">utama</span></sc-if>
              </span>
              <span style="display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-top:3px;">{{ e.tag }}</span>
            </span>
            <span style="flex:none; text-align:right; white-space:nowrap;">
              <span style="display:block; font-family:var(--font-mono); font-size:14px; font-weight:600; color:{{ e.loadColor }}; line-height:1.1;">{{ e.load }}</span>
              <span style="display:block; font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); margin-top:2px;">{{ e.reps }}</span>
            </span>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button sc-camel-on-click="{{ startPrimary }}" style="flex:1; height:48px; border:none; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-size:15px; font-weight:700; cursor:pointer;">{{ startLabel }}</button>
      <button sc-camel-on-click="{{ refreshRec }}" style="height:48px; padding:0 18px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:14px; cursor:pointer;">Ganti</button>
    </div>
    </div>
  </div>

  <sc-if value="{{ altOpen }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:12px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:14px 16px;">
      <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;">sesi alternatif hari ini</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <sc-for list="{{ altOpts }}" as="a" hint-placeholder-count="3">
          <button sc-camel-on-click="{{ a.onPick }}" style="display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; background:var(--surface-warm-raised); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:13px 15px; cursor:pointer; color:var(--text-primary); text-align:left;">
            <span>
              <span style="display:block; font-size:14.5px; font-weight:600;">{{ a.title }}</span>
              <span style="display:block; font-size:12px; color:var(--text-muted);">{{ a.sub }}</span>
            </span>
            <span style="font-family:var(--font-mono); font-size:10px; color:var(--gold-400); flex:none;">PILIH ›</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showReasons }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:12px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); overflow:hidden;">
      <button sc-camel-on-click="{{ toggleReasons }}" style="width:100%; display:flex; justify-content:space-between; align-items:center; gap:10px; background:transparent; border:none; padding:13px 16px; cursor:pointer; color:var(--text-muted); text-align:left;">
        <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase;">kenapa sesi ini · decision engine</span>
        <span style="font-family:var(--font-mono); font-size:10px; color:var(--text-faint);">{{ reasonsChevron }}</span>
      </button>
      <sc-if value="{{ reasonsOpen }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:10px; padding:0 16px 14px;">
          <sc-for list="{{ recReasons }}" as="g" hint-placeholder-count="4">
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-400);">{{ g.gate }}</span>
              <span style="font-size:13px; color:var(--text-secondary); line-height:1.5;">{{ g.text }}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>
  </sc-if>

  <sc-if value="{{ recHidden }}" hint-placeholder-val="{{ false }}">
    <button sc-camel-on-click="{{ goWorkout }}" style="margin-top:16px; width:100%; text-align:left; position:relative; overflow:hidden; border:1px solid var(--border-warm); border-radius:var(--radius-lg); padding:20px 18px; background:linear-gradient(155deg, #241a0e 0%, #1a150f 46%, #141210 100%); cursor:pointer; color:var(--text-primary);">
      <span aria-hidden="true" style="position:absolute; top:-90px; right:-60px; width:260px; height:220px; pointer-events:none; background:radial-gradient(50% 50% at 70% 20%, rgba(232,161,60,0.28), transparent 70%);"></span>
      <div style="position:relative;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:6px; height:6px; border-radius:99px; background:var(--gold-400); box-shadow:0 0 8px var(--gold-400); animation:ffpulse 2.4s infinite;"></span>
          <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.24em; text-transform:uppercase; color:var(--gold-400);">sesi sedang berjalan</div>
        </div>
        <div style="font-family:var(--font-serif); font-size:30px; line-height:1.05; margin-top:10px;">{{ abTitle }}</div>
        <div style="color:var(--text-secondary); font-size:13.5px; margin-top:4px;">Dimulai {{ abStarted }} · {{ abElapsed }} berjalan</div>
        <div style="margin-top:16px; display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 20px; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-size:14.5px; font-weight:700;">Lanjutkan sesi →</div>
        <div style="font-size:12px; color:var(--text-faint); margin-top:10px;">Selesaikan atau buang sesi ini untuk mendapat rekomendasi baru.</div>
      </div>
    </button>
  </sc-if>

  <!-- Weekly recap strip -->
  <div style="margin-top:18px; display:flex; align-items:stretch; gap:8px;">
    <sc-for list="{{ recapTiles }}" as="t" hint-placeholder-count="4">
      <div style="flex:1; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:11px 10px; text-align:center;">
        <div style="font-family:var(--font-serif); font-size:22px; line-height:1; color:{{ t.color }};">{{ t.value }}</div>
        <div style="font-family:var(--font-mono); font-size:8px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-top:5px;">{{ t.label }}</div>
      </div>
    </sc-for>
  </div>

  <!-- Recovery map -->
  <div style="margin-top:18px; position:relative; overflow:hidden; border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:16px; background:radial-gradient(120% 90% at 50% 0%, #10161f 0%, #0c1017 55%, var(--surface-warm-card) 100%);">
    <div aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; opacity:0.5; background-image:linear-gradient(rgba(90,140,190,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(90,140,190,0.09) 1px, transparent 1px); background-size:22px 22px;"></div>
    <div aria-hidden="true" style="position:absolute; top:-60px; left:50%; transform:translateX(-50%); width:280px; height:200px; pointer-events:none; background:radial-gradient(50% 50% at 50% 0%, rgba(77,144,200,0.14), transparent 70%);"></div>
    <div style="position:relative;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div>
          <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--cobalt-400);">recovery map</div>
          <div style="font-size:11px; color:var(--text-faint); margin-top:2px;">kesiapan otot · {{ rmReadyCount }} siap</div>
        </div>
        <div style="display:flex; gap:2px; padding:3px; border-radius:999px; border:1px solid var(--border-subtle); background:rgba(8,9,11,0.35);">

    <sc-if value="{{ cardioFormOpen }}" hint-placeholder-val="{{ false }}">

    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold-400); animation:ffpulse 2.4s infinite; white-space:nowrap;">sesi aktif · {{ asElapsed }}</div>
        <div style="font-family:var(--font-serif); font-size:26px; margin-top:2px;">{{ asTitle }}</div>
        <div style="font-size:12px; color:var(--text-faint); margin-top:2px;">Dimulai jam {{ asStarted }}</div>
      </div>
      <div style="display:flex; gap:8px; flex:none;">
        <button sc-camel-on-click="{{ openCardioForm }}" style="height:36px; padding:0 14px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-muted); font-size:12.5px; cursor:pointer; white-space:nowrap;">＋ Cardio</button>
        <button sc-camel-on-click="{{ discardSession }}" style="height:36px; padding:0 14px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-muted); font-size:12.5px; cursor:pointer;">Buang</button>
      </div>
    </div>

    <sc-if value="{{ asStale }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:14px; display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border:1px solid rgba(232,161,60,0.4); border-radius:var(--radius-md); background:rgba(232,161,60,0.08);">
        <span style="width:6px; height:6px; border-radius:99px; background:var(--warning); flex:none; margin-top:5px;"></span>
        <div style="flex:1;">
          <div style="font-size:13px; color:var(--gold-300); line-height:1.5;">Sesi ini sudah {{ asElapsed }} — kemungkinan lupa ditutup. Selesaikan sekarang (durasi dikoreksi otomatis) atau buang.</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button sc-camel-on-click="{{ openFeedback }}" style="height:38px; padding:0 16px; border:none; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-weight:700; font-size:12.5px; cursor:pointer;">Selesaikan</button>
            <button sc-camel-on-click="{{ discardSession }}" style="height:38px; padding:0 16px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:12.5px; cursor:pointer;">Buang</button>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ asWarmupPhase }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:16px; position:relative; overflow:hidden; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:16px;">
        <span aria-hidden="true" style="position:absolute; top:-50px; right:-40px; width:180px; height:130px; pointer-events:none; background:radial-gradient(50% 50% at 65% 25%, rgba(23,181,115,0.12), transparent 70%);"></span>
        <div style="position:relative;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-muted);">pemanasan</div>
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--data-positive);">{{ warmupDone }}/{{ warmupTotal }} · ± {{ warmupTime }}</div>
        </div>
        <div style="height:4px; border-radius:99px; background:var(--surface-warm-raised); overflow:hidden; margin-bottom:14px;"><span style="{{ warmupBarStyle }}"></span></div>
        <div style="display:flex; flex-direction:column;">
          <sc-for list="{{ asWarmup }}" as="w" hint-placeholder-count="4">
            <div style="display:flex; gap:12px;">
              <div style="flex:none; display:flex; flex-direction:column; align-items:center; width:34px;">
                <button sc-camel-on-click="{{ w.onToggle }}" style="{{ w.checkStyle }}">{{ w.checkGlyph }}</button>
                <sc-if value="{{ w.notLast }}" hint-placeholder-val="{{ true }}"><span style="{{ w.lineStyle }}"></span></sc-if>
              </div>
              <button sc-camel-on-click="{{ w.onToggle }}" style="{{ w.cardStyle }}">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                  <span style="{{ w.iconStyle }}"><svg sc-camel-view-box="0 0 24 24" style="width:15px; height:15px;" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ w.icon }}"></path></svg></span>
                  <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:{{ w.labelColor }};">{{ w.t }}</span>
                  <span style="margin-left:auto; font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); padding:2px 7px; border:1px solid var(--border-subtle); border-radius:999px; white-space:nowrap;">{{ w.dur }}</span>
                </div>
                <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px; line-height:1.4;">{{ w.goal }}</div>
                <div style="display:flex; flex-direction:column; gap:4px;">
                  <sc-for list="{{ w.items }}" as="it" hint-placeholder-count="3">
                    <div style="display:flex; gap:7px; font-size:12.5px; color:{{ w.itemColor }}; line-height:1.4;"><span style="color:{{ w.bulletColor }}; flex:none;">–</span><span>{{ it }}</span></div>
                  </sc-for>
                </div>
              </button>
            </div>
          </sc-for>
        </div>
        <button sc-camel-on-click="{{ startMain }}" style="margin-top:16px; width:100%; height:48px; border:none; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-weight:700; font-size:15px; cursor:pointer;">Mulai latihan utama →</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ asMainPhase }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:14px; margin-bottom:4px;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
          <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-muted);">gerakan {{ asDoneCount }} / {{ asTotalCount }}</span>
          <span style="font-family:var(--font-mono); font-size:10px; color:var(--gold-400);">{{ asSetsDone }} set selesai</span>
        </div>
        <div style="height:6px; border-radius:99px; background:var(--surface-warm-raised); overflow:hidden;">
          <div style="{{ asProgressStyle }}"></div>
        </div>
      </div>
      <div style="margin-top:10px; display:flex; flex-direction:column; gap:10px;">
        <sc-for list="{{ asExercises }}" as="ex" hint-placeholder-count="4">
          <div style="{{ ex.cardStyle }}">
            <button sc-camel-on-click="{{ ex.onOpen }}" style="width:100%; display:flex; align-items:center; gap:12px; background:transparent; border:none; padding:14px 16px; cursor:pointer; color:var(--text-primary); text-align:left;">
              <span style="{{ ex.numStyle }}">{{ ex.num }}</span>
              <span style="flex:1; min-width:0;">
                <span style="display:block; font-size:15px; font-weight:600;">{{ ex.name }}</span>
                <span style="display:block; font-size:12px; color:var(--text-muted);">{{ ex.sub }}</span>
              </span>
              <span style="font-family:var(--font-mono); font-size:11px; color:{{ ex.doneColor }}; white-space:nowrap;">{{ ex.progress }}</span>
            </button>
            <sc-if value="{{ ex.open }}" hint-placeholder-val="{{ false }}">
              <div style="padding:0 16px 14px;">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; padding:9px 12px; border-radius:var(--radius-sm); background:rgba(8,9,11,0.28); border:1px solid var(--border-subtle);">
                  <span style="font-size:12px; color:var(--gold-300);">target {{ ex.target }} · rest {{ ex.restLabel }}</span>
                  <button sc-camel-on-click="{{ ex.onTechnique }}" style="flex:none; display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 12px; border:1px solid var(--border-warm); border-radius:999px; background:var(--interactive-warm-soft); color:var(--gold-300); font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap;">◈ Teknik</button>
                </div>
                <div style="font-size:11px; color:var(--text-faint); margin-bottom:8px;">{{ ex.note }}</div>
                <div style="display:grid; grid-template-columns:30px 1fr 1fr 48px; gap:8px; font-family:var(--font-mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint); padding:0 2px 6px;">
                  <span>set</span><span style="text-align:center;">{{ ex.wUnit }}</span><span style="text-align:center;">{{ ex.rUnit }}</span><span></span>
                </div>
                <div style="display:flex; flex-direction:column; gap:8px;">
                  <sc-for list="{{ ex.sets }}" as="st" hint-placeholder-count="3">
                    <div style="{{ st.rowStyle }}">
                      <button sc-camel-on-click="{{ st.onType }}" title="Tap: set kerja → warm-up → drop" style="height:46px; padding:0; border:1px solid {{ st.typeBorder }}; border-radius:8px; background:transparent; font-family:var(--font-mono); font-size:10.5px; line-height:1.1; color:{{ st.numColor }}; cursor:pointer;">{{ st.label }}</button>
                      <div style="display:flex; align-items:center; background:var(--surface-warm-raised); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); height:46px;">
                        <button sc-camel-on-click="{{ st.wDown }}" style="width:36px; height:100%; background:transparent; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">−</button>
                        <input value="{{ st.w }}" sc-camel-on-change="{{ st.wSet }}" sc-camel-input-mode="decimal" style="flex:1; min-width:0; width:100%; text-align:center; font-size:16px; font-weight:600; background:transparent; border:none; color:var(--text-primary); padding:0;">
                        <button sc-camel-on-click="{{ st.wUp }}" style="width:36px; height:100%; background:transparent; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">＋</button>
                      </div>
                      <div style="display:flex; align-items:center; background:var(--surface-warm-raised); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); height:46px;">
                        <button sc-camel-on-click="{{ st.rDown }}" style="width:36px; height:100%; background:transparent; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">−</button>
                        <input value="{{ st.r }}" sc-camel-on-change="{{ st.rSet }}" sc-camel-input-mode="numeric" style="flex:1; min-width:0; width:100%; text-align:center; font-size:16px; font-weight:600; background:transparent; border:none; color:var(--text-primary); padding:0;">
                        <button sc-camel-on-click="{{ st.rUp }}" style="width:36px; height:100%; background:transparent; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">＋</button>
                      </div>
                      <button sc-camel-on-click="{{ st.onDone }}" style="{{ st.doneStyle }}">✓</button>
                    </div>
                  </sc-for>
                </div>
                <div style="display:flex; gap:8px; margin-top:12px; align-items:center;">
                  <button sc-camel-on-click="{{ ex.onCopy }}" style="flex:1; height:38px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:12.5px; cursor:pointer;">Copy set lalu</button>
                  <button sc-camel-on-click="{{ ex.onAddSet }}" style="flex:1; height:38px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:12.5px; cursor:pointer;">＋ Set</button>
                  <button sc-camel-on-click="{{ ex.onToggleMore }}" style="flex:none; width:38px; height:38px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:16px; cursor:pointer;">{{ ex.moreGlyph }}</button>
                </div>
                <sc-if value="{{ ex.allDone }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex; align-items:center; gap:6px; margin-top:10px; flex-wrap:wrap;">
                    <span style="font-size:11.5px; color:var(--text-muted); margin-right:2px;">Gerakan ini terasa:</span>
                    <sc-for list="{{ ex.fbOpts }}" as="o" hint-placeholder-count="3"><button sc-camel-on-click="{{ o.onTap }}" style="{{ o.style }}">{{ o.label }}</button></sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{ ex.moreOpen }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex; gap:8px; margin-top:8px;">
                    <button sc-camel-on-click="{{ ex.onReplace }}" style="flex:1; height:38px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:12.5px; cursor:pointer;">Ganti gerakan</button>
                    <button sc-camel-on-click="{{ ex.onSkip }}" style="flex:1; height:38px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-faint); font-size:12.5px; cursor:pointer;">{{ ex.skipLabel }}</button>
                  </div>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <button sc-camel-on-click="{{ openBuilderAdd }}" style="margin-top:10px; width:100%; height:46px; border:1px dashed var(--border-warm); border-radius:999px; background:transparent; color:var(--gold-300); font-size:13.5px; font-weight:600; cursor:pointer;">＋ Tambah gerakan ke sesi ini</button>
      <button sc-camel-on-click="{{ openFeedback }}" style="margin-top:10px; width:100%; height:52px; border:none; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-weight:700; font-size:16px; cursor:pointer;">Selesaikan sesi</button>
      <div style="margin-top:10px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:12px 14px;">
        <div style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;">cool-down opsional · 3–5 menit</div>
        <sc-for list="{{ cooldown }}" as="c" hint-placeholder-count="3">
          <div style="font-size:12.5px; color:var(--text-muted); padding:2px 0;">· {{ c.d }}</div>
        </sc-for>
      </div>
    </sc-if>
  </sc-if>

  <!-- Custom session builder -->
  <sc-if value="{{ builderOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:rgba(8,9,11,0.82); z-index:59; display:flex; align-items:flex-end; justify-content:center;" sc-camel-on-click="{{ closeBuilder }}">
      <div style="width:100%; max-width:430px; height:92dvh; background:var(--surface-warm-base); border:1px solid var(--border-default); border-radius:16px 16px 0 0; display:flex; flex-direction:column; overflow:hidden; animation:ffsheet 260ms var(--ease-out, ease-out);" sc-camel-on-click="{{ nutFormStop }}">
        <div style="padding:12px 18px 0; flex:none;">
          <div style="width:36px; height:4px; border-radius:99px; background:var(--border-default); margin:0 auto 12px;"></div>
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="flex:1; min-width:0;">
              <div style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold-400);">{{ builderKicker }}</div>
              <div style="font-family:var(--font-serif); font-size:22px; line-height:1.1; margin-top:2px;">{{ builderTitle }}</div>
            </div>
            <button sc-camel-on-click="{{ closeBuilder }}" style="width:44px; height:44px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:16px; cursor:pointer; flex:none;">✕</button>
          </div>
          <input value="{{ builderSearch }}" sc-camel-on-input="{{ onBuilderSearch }}" placeholder="Cari gerakan…" style="width:100%; height:46px; margin-top:12px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 14px; font-size:15px;">
          <div style="display:flex; flex-wrap:wrap; gap:6px; padding:10px 0 8px;">
            <sc-for list="{{ builderLocChips }}" as="c" hint-placeholder-count="2">
              <button sc-camel-on-click="{{ c.onTap }}" style="{{ c.style }}">{{ c.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 12px;">
          <sc-for list="{{ builderGroups }}" as="g" hint-placeholder-count="5">
            <div style="margin-top:8px;">
              <div style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-400); padding:8px 2px 4px;">{{ g.label }}</div>
              <div style="display:flex; flex-direction:column; border:1px solid var(--border-subtle); border-radius:var(--radius-md); overflow:hidden;">
                <sc-for list="{{ g.items }}" as="x" hint-placeholder-count="3">
                  <button sc-camel-on-click="{{ x.onTap }}" style="{{ x.rowStyle }}">
                    <span style="{{ x.checkStyle }}">✓</span>
                    <span style="flex:1; min-width:0;">
                      <span style="display:block; font-size:13.5px; font-weight:600; line-height:1.25;">{{ x.name }}</span>
                      <span style="display:block; font-size:11px; color:var(--text-faint);">{{ x.sub }}</span>
                    </span>
                    <span style="font-family:var(--font-mono); font-size:10.5px; color:var(--gold-300); flex:none; white-space:nowrap;">{{ x.plan }}</span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-for>
          <sc-if value="{{ builderEmpty }}" hint-placeholder-val="{{ false }}">
            <div style="padding:20px 4px; font-size:13px; color:var(--text-faint);">Tidak ada gerakan cocok.</div>
          </sc-if>
        </div>
        <div style="flex:none; padding:12px 18px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--border-subtle); background:var(--surface-warm-card);">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
            <span style="font-size:12.5px; color:var(--text-muted);">{{ builderCountLabel }}</span>
            <sc-if value="{{ builderHasPicks }}" hint-placeholder-val="{{ false }}">
              <button sc-camel-on-click="{{ clearBuilder }}" style="height:30px; padding:0 12px; border:1px solid var(--border-subtle); border-radius:999px; background:transparent; color:var(--text-faint); font-size:11.5px; cursor:pointer;">Kosongkan</button>
            </sc-if>
          </div>
          <button sc-camel-on-click="{{ startBuilder }}" style="{{ builderCtaStyle }}">{{ builderCta }}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- Replace sheet -->
  <sc-if value="{{ replOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:rgba(8,9,11,0.7); z-index:40; display:flex; align-items:flex-end; justify-content:center;" sc-camel-on-click="{{ closeRepl }}">
      <div style="width:100%; max-width:430px; background:var(--surface-warm-raised); border:1px solid var(--border-default); border-radius:16px 16px 0 0; padding:12px 18px 18px; max-height:70dvh; overflow:auto; animation:ffsheet 260ms var(--ease-out, ease-out);">
        <div style="width:36px; height:4px; border-radius:99px; background:var(--border-default); margin:0 auto 14px;"></div>
        <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px;">alternatif — pola gerak &amp; otot serupa</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <sc-for list="{{ replOpts }}" as="o" hint-placeholder-count="4">
            <button sc-camel-on-click="{{ o.onPick }}" style="display:flex; justify-content:space-between; align-items:center; width:100%; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:14px 16px; color:var(--text-primary); font-size:14.5px; cursor:pointer;">
              <span>{{ o.name }}</span>
              <span style="font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);">{{ o.equip }}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- Feedback sheet -->
  <sc-if value="{{ fbOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:rgba(8,9,11,0.75); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px;">
      <div style="width:100%; max-width:380px; background:var(--surface-warm-raised); border:1px solid var(--border-default); border-radius:var(--radius-lg); padding:22px;">
        <div style="font-family:var(--font-serif); font-size:22px;">Bagaimana sesinya?</div>
        <div style="font-size:13px; color:var(--text-muted); margin-top:4px;">Feedback ini memperbarui progressive overload &amp; sesi berikutnya.</div>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:16px;">
          <button sc-camel-on-click="{{ fbRingan }}" style="height:52px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-primary); font-size:15px; cursor:pointer;">Terlalu ringan</button>
          <button sc-camel-on-click="{{ fbPas }}" style="height:52px; border:none; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-weight:700; font-size:15px; cursor:pointer;">Pas</button>
          <button sc-camel-on-click="{{ fbBerat }}" style="height:52px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-primary); font-size:15px; cursor:pointer;">Terlalu berat</button>
        </div>
        <textarea value="{{ fbNote }}" sc-camel-on-input="{{ fbSetNote }}" placeholder="Catatan sesi (opsional) — mis. bahu agak nyeri, energi bagus…" style="margin-top:12px; width:100%; min-height:64px; resize:none; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:10px 12px; font-size:13.5px; line-height:1.5;"></textarea>
        <button sc-camel-on-click="{{ fbCancel }}" style="margin-top:8px; width:100%; height:40px; border:none; background:transparent; color:var(--text-faint); font-size:13px; cursor:pointer;">Kembali ke sesi</button>
      </div>
    </div>
  </sc-if>
</div>
</sc-if>

<!-- ============ HISTORY ============ -->
<sc-if value="{{ tabHistory }}" hint-placeholder-val="{{ false }}">
<div style="padding:22px 18px 0; animation:fftab 260ms var(--ease-out, ease-out);">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div style="font-family:var(--font-serif); font-size:26px;">History</div>
    <div style="display:flex; align-items:center; gap:8px;">

<!-- Onboarding -->

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
              <label style="display:block;"><span style="display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:4px;">Tahun lahir</span><input value="{{ obYear }}" sc-camel-on-change="{{ obSetYear }}" sc-camel-input-mode="numeric" placeholder="1990" style="width:100%; height:48px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:16px;"></label>
              <label style="display:block;"><span style="display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:4px;">Tinggi (cm)</span><input value="{{ obHeight }}" sc-camel-on-change="{{ obSetHeight }}" sc-camel-input-mode="decimal" placeholder="170" style="width:100%; height:48px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:16px;"></label>
              <label style="display:block;"><span style="display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:4px;">Berat sekarang (kg)</span><input value="{{ obWeight }}" sc-camel-on-change="{{ obSetWeight }}" sc-camel-input-mode="decimal" placeholder="70" style="width:100%; height:48px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:16px;"></label>
              <label style="display:block;"><span style="display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:4px;">Body fat % (opsional)</span><input value="{{ obBf }}" sc-camel-on-change="{{ obSetBf }}" sc-camel-input-mode="decimal" placeholder="dari timbangan" style="width:100%; height:48px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:16px;"></label>
              <label style="display:block;"><span style="display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:4px;">HR istirahat (opsional)</span><input value="{{ obRhr }}" sc-camel-on-change="{{ obSetRhr }}" sc-camel-input-mode="numeric" placeholder="64" style="width:100%; height:48px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:16px;"></label>
            </div>
            <div style="font-size:12px; color:var(--text-faint); line-height:1.5;">Body fat dari timbangan membuat estimasi BF berikutnya lebih akurat. Tanpa itu, BF tidak diestimasi sampai kamu mencatat satu pengukuran.</div>
          </div>
        </sc-if>
        <sc-if value="{{ obIsSummary }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:22px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; animation:ffrise 400ms 120ms both;">
            <div style="background:var(--surface-warm-card); border:1px solid var(--border-warm); border-radius:var(--radius-md); padding:14px 10px; text-align:center;"><div style="font-family:var(--font-serif); font-size:26px; color:var(--gold-300);">{{ obSumKcal }}</div><div style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-muted); margin-top:4px;">kkal / hari</div></div>
            <div style="background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:14px 10px; text-align:center;"><div style="font-family:var(--font-serif); font-size:26px;">{{ obSumProtein }}</div><div style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-muted); margin-top:4px;">protein</div></div>
            <div style="background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:14px 10px; text-align:center;"><div style="font-family:var(--font-serif); font-size:26px;">{{ obSumDays }}</div><div style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-muted); margin-top:4px;">latihan</div></div>

        <sc-if value="{{ obHasOptions }}" hint-placeholder-val="{{ true }}">

              <span style="flex:1; text-align:left;"><span style="display:block; font-size:15px; font-weight:600;">{{ o.label }}</span><span style="display:block; font-size:12.5px; color:var(--text-muted);">{{ o.sub }}</span></span>

        <sc-if value="{{ obIntro }}" hint-placeholder-val="{{ true }}">
          <label style="display:block; margin-top:16px; text-align:center; font-size:13px; color:var(--gold-400); cursor:pointer;">Sudah punya backup FitFlow? Pulihkan dari file JSON<input type="file" accept="application/json,.json" sc-camel-on-change="{{ obRestore }}" style="display:none;"></label>

      </div>
      <div style="display:flex; gap:10px; padding-top:16px;">
        <sc-if value="{{ obCanBack }}" hint-placeholder-val="{{ false }}">

        </sc-if>
        <button sc-camel-on-click="{{ obNext }}" style="flex:1; height:52px; border:none; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-size:15px; font-weight:700; cursor:pointer;">{{ obCta }}</button>

      <button sc-camel-on-click="{{ obSkip }}" style="margin-top:10px; height:36px; border:none; background:transparent; color:var(--text-faint); font-size:13px; cursor:pointer;">Lewati</button>
    </div>
  </div>
</sc-if>

      <div style="{{ restBarStyle }}"></div>

<div style="padding:22px 18px 0; animation:fftab 260ms var(--ease-out, ease-out);">
  <div style="display:flex; align-items:center; gap:12px;">
    <button sc-camel-on-click="{{ nutBack }}" style="width:40px; height:40px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:17px; cursor:pointer; flex:none;">‹</button>
    <div>
      <div style="font-family:var(--font-serif); font-size:26px; line-height:1;">Nutrisi</div>
      <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint); margin-top:2px;">{{ nutTodayStr }}</div>
    </div>
  </div>

  <!-- Hero ring + macros -->
  <div style="margin-top:18px; position:relative; overflow:hidden; border:1px solid var(--border-warm); border-radius:var(--radius-lg); padding:20px 18px; background:linear-gradient(155deg, #241a0e 0%, #1a150f 46%, #141210 100%);">
    <span aria-hidden="true" style="position:absolute; top:-90px; right:-60px; width:260px; height:220px; pointer-events:none; background:radial-gradient(50% 50% at 70% 20%, rgba(232,161,60,0.26), transparent 70%);"></span>
    <div style="position:relative; display:flex; gap:18px; align-items:center;">
      <div style="position:relative; width:120px; height:120px; flex:none;">
      <svg sc-camel-view-box="0 0 120 120" style="width:120px; height:120px; display:block;">
        <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="9"></circle>
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--gold-500)" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{ nutHeroDash }}" transform="rotate(-90 60 60)"></circle>
      </svg>
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;">
        <span style="font-family:var(--font-serif); font-size:30px; line-height:1; color:#f3e6cd;">{{ nutKcal }}</span>
        <span style="font-family:var(--font-mono); font-size:8px; letter-spacing:0.12em; color:var(--text-muted); margin-top:3px;">/ {{ nutKcalTarget }} KKAL</span>
      </div>
      </div>
      <div style="flex:1;">
        <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold-400);">tersisa hari ini</div>
        <div style="font-family:var(--font-serif); font-size:34px; line-height:1; margin-top:4px; color:#fff;">{{ nutKcalLeft }} <span style="font-size:15px; color:var(--text-muted);">kkal</span></div>
        <div style="font-size:12px; color:var(--text-secondary); margin-top:6px; line-height:1.4;">{{ nutDayNote }}</div>

    </div>
    <div style="position:relative; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px;">

  </div>

  <!-- Energy targets: BMR · maintenance · deficit -->
  <div style="margin-top:12px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:16px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted);">target energi harian</div>
      <button sc-camel-on-click="{{ tgtOpen }}" style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold-400); background:transparent; border:1px solid var(--border-warm); border-radius:999px; padding:5px 12px; cursor:pointer;">{{ tgtBtnLabel }}</button>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
      <div style="background:var(--surface-warm-raised); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:11px 12px;">
        <div style="font-family:var(--font-mono); font-size:8px; letter-spacing:0.12em; text-transform:uppercase; color:var(--steel-400, #8a8f98);">BMR</div>
        <div style="font-family:var(--font-serif); font-size:22px; margin-top:3px;">{{ enBmr }}</div>
        <div style="font-size:10px; color:var(--text-faint);">metabolisme basal</div>
      </div>
      <div style="background:var(--surface-warm-raised); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:11px 12px;">
        <div style="font-family:var(--font-mono); font-size:8px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cobalt-400);">maintenance</div>
        <div style="font-family:var(--font-serif); font-size:22px; margin-top:3px; color:var(--cobalt-400);">{{ enMaint }}</div>
        <div style="font-size:10px; color:var(--text-faint);">TDEE harian</div>
      </div>
      <div style="background:var(--surface-warm-raised); border:1px solid var(--border-warm); border-radius:var(--radius-sm); padding:11px 12px;">
        <div style="font-family:var(--font-mono); font-size:8px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-400);">target</div>
        <div style="font-family:var(--font-serif); font-size:22px; margin-top:3px; color:var(--gold-300);">{{ enTarget }}</div>
        <div style="font-size:10px; color:var(--text-faint);">{{ enDeficitLabel }}</div>
      </div>
    </div>
    <div style="position:relative; margin-top:16px; height:40px;">
      <div style="position:absolute; left:0; right:0; top:16px; height:8px; border-radius:99px; background:linear-gradient(90deg, var(--data-positive) 0%, var(--gold-500) 55%, var(--cobalt-400) 100%); opacity:0.32;"></div>
      <div style="position:absolute; left:0; right:0; top:16px; height:8px; border-radius:99px; overflow:hidden;"><div style="{{ enFillStyle }}"></div></div>
      <div style="{{ enBmrMark }}"></div><div style="{{ enTargetMark }}"></div><div style="{{ enMaintMark }}"></div>
      <div style="{{ enIntakeMark }}"></div>
    </div>
    <div style="display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:9px; color:var(--text-faint); margin-top:2px;"><span>intake {{ nutKcal }}</span><span>{{ enStatus }}</span></div>
    <div style="font-size:11px; color:var(--text-muted); line-height:1.5; margin-top:8px;">{{ enNote }}</div>
  </div>

  <!-- Target editor sheet -->
  <sc-if value="{{ tgtEditOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:rgba(8,9,11,0.8); z-index:60; display:flex; align-items:flex-end; justify-content:center;" sc-camel-on-click="{{ tgtClose }}">
      <div style="width:100%; max-width:430px; background:var(--surface-warm-raised); border:1px solid var(--border-default); border-radius:16px 16px 0 0; padding:12px 18px 28px; animation:ffsheet 260ms var(--ease-out, ease-out);" sc-camel-on-click="{{ nutFormStop }}">
        <div style="width:36px; height:4px; border-radius:99px; background:var(--border-default); margin:0 auto 14px;"></div>
        <div style="font-family:var(--font-serif); font-size:22px;">Atur target makro</div>
        <div style="font-size:12.5px; color:var(--text-muted); line-height:1.5; margin-top:4px;">Isi protein, karbo &amp; lemak (gram). Kalori dihitung otomatis (4·P + 4·K + 9·L).</div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px;">
          <div>
            <div style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--data-highlight, var(--gold-400)); margin-bottom:5px;">protein (g)</div>
            <input value="{{ tgtP }}" sc-camel-on-input="{{ tgtSetP }}" sc-camel-input-mode="numeric" style="width:100%; height:48px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:17px; font-weight:700;">
          </div>
          <div>
            <div style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cobalt-400); margin-bottom:5px;">karbo (g)</div>
            <input value="{{ tgtC }}" sc-camel-on-input="{{ tgtSetC }}" sc-camel-input-mode="numeric" style="width:100%; height:48px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:17px; font-weight:700;">
          </div>
          <div>
            <div style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cat-4, #c17a45); margin-bottom:5px;">lemak (g)</div>
            <input value="{{ tgtF }}" sc-camel-on-input="{{ tgtSetF }}" sc-camel-input-mode="numeric" style="width:100%; height:48px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 12px; font-size:17px; font-weight:700;">
          </div>
        </div>
        <div style="display:flex; align-items:baseline; justify-content:space-between; margin-top:16px; padding:12px 14px; border:1px solid var(--border-warm); border-radius:var(--radius-md); background:var(--interactive-warm-soft);">
          <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-400);">total kalori</span>
          <span style="font-family:var(--font-serif); font-size:26px; color:var(--gold-300);">{{ tgtKcal }} <span style="font-size:13px; color:var(--text-muted);">kkal</span></span>
        </div>
        <div style="font-size:11px; color:var(--text-muted); margin-top:8px; line-height:1.5;">{{ tgtHint }}</div>
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button sc-camel-on-click="{{ tgtSave }}" style="flex:1; height:48px; border:none; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-weight:700; font-size:15px; cursor:pointer;">Simpan target</button>
          <button sc-camel-on-click="{{ tgtReset }}" style="height:48px; padding:0 16px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:13px; cursor:pointer; white-space:nowrap;">Kembali otomatis</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- Add food: prominent CTA opens full-height search sheet -->
  <button sc-camel-on-click="{{ nutOpenSearch }}" style="margin-top:16px; width:100%; display:flex; align-items:center; gap:12px; height:58px; padding:0 20px; border:none; border-radius:16px; background:var(--interactive-warm); color:var(--interactive-warm-ink); cursor:pointer; box-shadow:0 8px 30px -12px rgba(232,161,60,0.6);">
    <span style="width:32px; height:32px; flex:none; border-radius:10px; background:rgba(8,9,11,0.16); display:flex; align-items:center; justify-content:center; font-size:22px; line-height:1;">＋</span>
    <span style="flex:1; text-align:left; font-size:16px; font-weight:700;">Tambah makanan</span>
    <sc-if value="{{ nutHasRecents }}" hint-placeholder-val="{{ false }}">
      <span style="font-family:var(--font-mono); font-size:11px; opacity:0.75;">{{ nutRecentHint }}</span>
    </sc-if>
  </button>

  <!-- Search sheet: recents → categories (grid) → list, one scroll zone -->
  <sc-if value="{{ nutSearchOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:rgba(8,9,11,0.82); z-index:58; display:flex; align-items:flex-end; justify-content:center;" sc-camel-on-click="{{ nutCloseSearch }}">
      <div style="width:100%; max-width:430px; height:92dvh; background:var(--surface-warm-base); border:1px solid var(--border-default); border-radius:16px 16px 0 0; display:flex; flex-direction:column; overflow:hidden; animation:ffsheet 260ms var(--ease-out, ease-out);" sc-camel-on-click="{{ nutFormStop }}">
        <div style="padding:12px 18px 0; flex:none;">
          <div style="width:36px; height:4px; border-radius:99px; background:var(--border-default); margin:0 auto 12px;"></div>
          <div style="display:flex; align-items:center; gap:10px;">
            <input value="{{ nutSearch }}" sc-camel-on-input="{{ nutSetSearch }}" placeholder="Cari makanan…" sc-camel-auto-focus="{{ true }}" style="flex:1; height:48px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); color:var(--text-primary); padding:0 16px; font-size:15px;">
            <button sc-camel-on-click="{{ nutCloseSearch }}" style="width:48px; height:48px; border:1px solid var(--border-default); border-radius:999px; background:transparent; color:var(--text-secondary); font-size:16px; cursor:pointer; flex:none;">✕</button>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:7px; padding:12px 0 10px;">
            <sc-for list="{{ nutCatChips }}" as="c" hint-placeholder-count="6">
              <button sc-camel-on-click="{{ c.onTap }}" style="{{ c.style }}">{{ c.label }}</button>
            </sc-for>
          </div>
          <sc-if value="{{ nutHasFlags }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; gap:6px; padding:0 0 8px; flex-wrap:wrap;">
              <sc-for list="{{ nutMacroChips }}" as="m" hint-placeholder-count="3"><span style="{{ m.style }}">{{ m.label }} {{ m.txt }}</span></sc-for>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px; padding:0 0 10px;">
              <sc-for list="{{ nutFlags }}" as="fl" hint-placeholder-count="1">
                <div style="{{ fl.boxStyle }}"><span style="{{ fl.dotStyle }}"></span><span style="flex:1;">{{ fl.text }}</span></div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ nutHasHealthFlags }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; flex-direction:column; gap:6px; padding:0 0 10px;">
              <sc-for list="{{ nutHealthFlags }}" as="fl" hint-placeholder-count="1">
                <div style="{{ fl.boxStyle }}"><span style="{{ fl.dotStyle }}"></span><span style="flex:1;">{{ fl.text }}</span></div>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <div style="flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 24px;">
          <sc-if value="{{ nutShowRecents }}" hint-placeholder-val="{{ false }}">
            <div style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); padding:4px 2px 8px;">sering dipakai</div>
            <div style="display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px;">
              <sc-for list="{{ nutRecents }}" as="q" hint-placeholder-count="5">
                <button sc-camel-on-click="{{ q.onTap }}" style="display:flex; align-items:center; gap:7px; padding:9px 13px; border:1px solid var(--border-warm); border-radius:999px; background:var(--interactive-warm-soft); color:var(--text-primary); font-size:13px; cursor:pointer;">
                  <span style="font-size:15px;">{{ q.icon }}</span>
                  <span style="white-space:nowrap;">{{ q.name }}</span>
                  <span style="font-family:var(--font-mono); font-size:10px; color:var(--gold-400); white-space:nowrap;">{{ q.p }}p</span>
                </button>
              </sc-for>
            </div>
            <div style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); padding:0 2px 6px;">semua makanan</div>
          </sc-if>
          <div style="display:flex; flex-direction:column; border:1px solid var(--border-subtle); border-radius:var(--radius-md); overflow:hidden;">
            <sc-for list="{{ nutFoodList }}" as="f" hint-placeholder-count="10">
              <button sc-camel-on-click="{{ f.onTap }}" style="display:flex; align-items:center; gap:10px; width:100%; background:transparent; border:none; border-bottom:1px solid var(--border-subtle); padding:10px 12px; cursor:pointer; color:var(--text-primary); text-align:left;">
                <span style="width:24px; text-align:center; font-size:15px; flex:none;">{{ f.icon }}</span>
                <span style="flex:1; min-width:0; display:flex; align-items:baseline; gap:7px;">
                  <span style="font-size:13.5px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ f.name }}</span>
                  <span style="font-family:var(--font-mono); font-size:10px; color:var(--text-faint); white-space:nowrap; flex:none;">{{ f.unit }}</span>
                </span>
                <span style="font-family:var(--font-mono); font-size:12.5px; color:var(--gold-300); flex:none;">{{ f.kcal }}</span>
                <span style="font-family:var(--font-mono); font-size:10px; color:var(--text-faint); flex:none; width:30px; text-align:right;">{{ f.p }}p</span>
                <sc-if value="{{ f.hasHealthTag }}" hint-placeholder-val="{{ false }}"><span style="flex:none; font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.06em; text-transform:uppercase; padding:2px 5px; border-radius:4px; color:var(--warning); border:1px solid rgba(232,161,60,0.4);">{{ f.healthTag }}</span></sc-if>
                <sc-if value="{{ f.isCustom }}" hint-placeholder-val="{{ false }}"><span sc-camel-on-click="{{ f.onDelFood }}" style="flex:none; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(199,68,54,0.4); border-radius:6px; color:var(--danger); font-size:11px;">✕</span></sc-if>
              </button>
            </sc-for>
            <sc-if value="{{ nutListEmpty }}" hint-placeholder-val="{{ false }}">
              <div style="padding:16px 14px; font-size:13px; color:var(--text-faint);">Tidak ada makanan cocok.</div>
            </sc-if>
          </div>
          <button sc-camel-on-click="{{ nutAddCustom }}" style="margin-top:12px; width:100%; display:flex; align-items:center; justify-content:center; gap:6px; height:46px; border:1px dashed var(--border-default); border-radius:999px; background:transparent; color:var(--text-muted); font-size:13.5px; cursor:pointer;">＋ Makanan baru (input makro manual)</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- Portion picker sheet -->
  <sc-if value="{{ nutPickOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:rgba(8,9,11,0.8); z-index:60; display:flex; align-items:flex-end; justify-content:center;" sc-camel-on-click="{{ nutPickClose }}">
      <div style="width:100%; max-width:430px; background:var(--surface-warm-raised); border:1px solid var(--border-default); border-radius:16px 16px 0 0; padding:12px 18px 28px; max-height:82dvh; overflow:auto; animation:ffsheet 260ms var(--ease-out, ease-out);" sc-camel-on-click="{{ nutFormStop }}">
        <div style="width:36px; height:4px; border-radius:99px; background:var(--border-default); margin:0 auto 14px;"></div>
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="width:44px; height:44px; border-radius:12px; background:var(--surface-warm-card); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none;">{{ nutPickIcon }}</span>
          <div style="flex:1; min-width:0;">
            <div style="font-family:var(--font-serif); font-size:20px; line-height:1.1;">{{ nutPickName }}</div>
            <div style="font-size:12px; color:var(--text-muted);">per {{ nutPickUnit }}<sc-if value="{{ nutPickEstimate }}" hint-placeholder-val="{{ false }}"><span style="color:var(--text-faint);"> · estimasi ±20%</span></sc-if></div>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; padding:12px 14px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md);">
          <span style="font-size:13px; color:var(--text-secondary);">{{ nutPickQtyLabel }}</span>
          <div style="display:flex; align-items:center; gap:4px;">
            <button sc-camel-on-click="{{ nutQtyDown }}" style="width:40px; height:40px; border:1px solid var(--border-default); border-radius:10px; background:transparent; color:var(--text-secondary); font-size:20px; cursor:pointer;">−</button>
            <span style="min-width:72px; text-align:center; font-family:var(--font-serif); font-size:22px;">{{ nutPickQty }}</span>
            <button sc-camel-on-click="{{ nutQtyUp }}" style="width:40px; height:40px; border:1px solid var(--border-default); border-radius:10px; background:transparent; color:var(--text-secondary); font-size:20px; cursor:pointer;">＋</button>
          </div>
        </div>
        <div style="display:flex; gap:6px; margin-top:8px;">
          <sc-for list="{{ nutQtyPresets }}" as="p" hint-placeholder-count="4">
            <button sc-camel-on-click="{{ p.onTap }}" style="{{ p.style }}">{{ p.label }}</button>
          </sc-for>
        </div>

        <sc-if value="{{ nutHasAddons }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:16px;">
            <div style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px;">tambahan (kalori tersembunyi)</div>
            <div style="display:flex; flex-wrap:wrap; gap:7px;">
              <sc-for list="{{ nutAddons }}" as="a" hint-placeholder-count="4">
                <button sc-camel-on-click="{{ a.onTap }}" style="{{ a.style }}">{{ a.label }} <span style="opacity:0.7;">+{{ a.kcal }}</span></button>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:18px; padding-top:14px; border-top:1px solid var(--border-subtle);">
          <div>
            <div style="font-family:var(--font-serif); font-size:30px; line-height:1;">{{ nutPickKcal }} <span style="font-size:14px; color:var(--text-muted);">kkal</span></div>
            <div style="font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); margin-top:4px;">{{ nutPickP }}p · {{ nutPickC }}c · {{ nutPickF }}f</div>
          </div>
          <button sc-camel-on-click="{{ nutPickAdd }}" style="height:50px; padding:0 26px; border:none; border-radius:999px; background:var(--interactive-warm); color:var(--interactive-warm-ink); font-size:15px; font-weight:700; cursor:pointer;">Tambah</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- Meal timeline -->
  <div style="margin-top:20px;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
      <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted);">catatan makan</div>
      <div style="font-size:11px; color:var(--text-faint);">{{ nutEntryCount }} entri</div>
    </div>
    <sc-if value="{{ nutCanRepeat }}" hint-placeholder-val="{{ false }}">
      <button sc-camel-on-click="{{ nutRepeatYesterday }}" style="width:100%; margin-bottom:10px; display:flex; align-items:center; gap:10px; height:44px; padding:0 14px; border:1px dashed var(--border-warm); border-radius:var(--radius-md); background:transparent; color:var(--gold-300); font-size:13px; cursor:pointer; text-align:left;"><span style="font-size:15px;">↻</span><span style="flex:1;">{{ nutRepeatLabel }}</span></button>
    </sc-if>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <sc-for list="{{ nutEntries }}" as="e" hint-placeholder-count="4">
        <sc-if value="{{ e.slotHead }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; justify-content:space-between; align-items:baseline; padding:6px 2px 0;"><span style="font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold-400);">{{ e.slotLabel }}</span><span style="font-family:var(--font-mono); font-size:10px; color:var(--text-faint);">{{ e.slotSum }}</span></div>
        </sc-if>
        <div style="display:flex; align-items:center; gap:12px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:12px 14px;">
          <span style="width:34px; height:34px; border-radius:10px; background:var(--surface-warm-raised); display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;">{{ e.icon }}</span>
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:600;">{{ e.name }}</div>
            <div style="display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px; color:var(--text-muted);"><input type="time" value="{{ e.time24 }}" sc-camel-on-change="{{ e.onTime }}" style="height:24px; padding:0 4px; background:transparent; border:1px solid var(--border-subtle); border-radius:5px; color:var(--text-secondary); font-family:var(--font-mono); font-size:11px;"><span>{{ e.kcal }} kkal</span></div>
          </div>
          <div style="text-align:right; flex:none;">
            <div style="font-family:var(--font-mono); font-size:12px; color:var(--gold-300);">{{ e.p }}p</div>
            <div style="font-family:var(--font-mono); font-size:10px; color:var(--text-faint);">{{ e.c }}c · {{ e.f }}f</div>
          </div>
          <button sc-camel-on-click="{{ e.onDelete }}" style="width:30px; height:30px; border:none; border-radius:99px; background:transparent; color:var(--text-faint); font-size:14px; cursor:pointer; flex:none;">✕</button>
        </div>
      </sc-for>
      <sc-if value="{{ nutEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center; padding:24px 16px; border:1px dashed var(--border-default); border-radius:var(--radius-md); color:var(--text-faint); font-size:13px;">Belum ada makanan tercatat hari ini. Tap chip di atas untuk mulai.</div>
      </sc-if>
    </div>
  </div>

  <!-- Weekly adherence -->
  <div style="margin-top:20px; margin-bottom:8px; background:var(--surface-warm-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:16px;">

      <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted);">target protein · 7 hari</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--gold-400);">streak {{ nutProteinStreak }} hari</div>

    <div style="font-size:12px; color:var(--text-muted); margin-top:12px; line-height:1.5;">{{ nutWeekNote }}</div>
